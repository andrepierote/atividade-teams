<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Ícone da aba do navegador (Favicon) -->
    <link rel="shortcut icon" href="imagens/Pictogrammers-Material-Alphabet-Alpha-l-circle-outline.24.png" type="image/x-icon">
    <title>
        Meu carrinho | Lart’s
    </title>
    <link rel="stylesheet" href="./carrinho.css">
    <script src="produtos.js" defer>
    </script>
    <script src="./carrinho.js" defer>
    </script>
</head>

<body>
    <a class="pular-conteudo" href="#conteudo">
        Pular para o conteúdo
    </a>
    <header class="loja-cabecalho">
        <a class="loja-cabecalho__marca" href="index.html">
            Lart’s
        </a>
        <nav class="loja-cabecalho__nav" aria-label="Navegação principal">
            <a href="index.html">
                Início
            </a>
            <a href="index.html#catalogo">
                Catálogo
            </a>
            <a href="aba-favoritos.html">
                Favoritos
            </a>
            <a href="aba-carrinho.html">
                Carrinho
            </a>
        </nav>
    </header>
    <main class="compra" id="conteudo">
        <p class="compra__etapa">
            SUA SELEÇÃO
        </p>
        <h1>
            Meu carrinho
        </h1>
        <p id="mensagem" class="compra__mensagem" role="status" aria-live="polite">
        </p>
        <div id="pagina-carrinho">
            <div class="compra__layout">
                <section aria-label="Produtos do carrinho" id="itens-carrinho" class="carrinho">
                </section>
                <aside class="resumo" aria-labelledby="titulo-resumo">
                    <h2 id="titulo-resumo">
                        Resumo da compra
                    </h2>
                    <div id="resumo-valores">
                    </div>
                    <a id="avancar" class="botao botao--principal" href="finalizacao.html">
                        Continuar para finalização
                    </a>
                    <a class="resumo__voltar" href="index.html#catalogo">
                        Continuar comprando
                    </a>
                </aside>
            </div>
        </div>
    </main>
    <footer class="loja-rodape">
        Lart’s — Moda que expressa quem você é.
    </footer>
</body>
</html>
