    <style>

/* =====================================
   CATÁLOGO
===================================== */

.catalogo {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 30px 5%;
}

.catalogo__titulo {
    margin: 25px 0;
    font-size: 35px;
    text-align: center;
}

.catalogo__divisor {
    width: 100%;
    border: 1px solid #000;
    margin-bottom: 45px;
}


/* =====================================
   CATEGORIAS
===================================== */

.catalogo__secao {
    width: 100%;
    margin-bottom: 60px;
}

.catalogo__cabecalho {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.catalogo__categoria-titulo {
    font-size: 36px;
    color: #000;
}


/* =====================================
   LINK VER MAIS
===================================== */

.catalogo__ver-mais {
    padding: 20px 15px;
    border: 1px solid rgb(255, 140, 0);
    border-radius: 5px;

    color: rgb(255, 140, 0);
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;

    transition: 0.3s;
}

.catalogo__ver-mais:hover {
    background-color: rgb(255, 140, 0);
    color: white;
}


/* =====================================
   PRODUTOS
===================================== */

.catalogo__produtos {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 25px;
    background-color: rgba(255, 228, 196, 0.244);
    padding: 10px;
    border-radius: 10px;
}

.produto-card {
    width: 100%;
    overflow: hidden;
    border-radius: 12px;
    padding-bottom: 50px;
}

.produto-card__figura {
    width: 100%;
    margin: 0;
    overflow: hidden;
}

.produto-card__imagem {
    display: block;
    width: 100%;
    height: 490px;
    object-fit: cover;
    transition: transform 0.3s;
    border-radius: 10px;
}

.produto-card__imagem:hover {
    transform: scale(1.028);
}
.produto-card__divisor{
    width: 100%;
    border: 1px solid #000;
    margin-top: 10px;
}
.produto-card__legenda{
    font-size: 18px;
}

/* =====================================
   RESPONSIVIDADE
===================================== */

@media screen and (max-width: 768px) {

    .catalogo__produtos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
    }

    .produto-card__imagem {
        height: 390px;
    }

    .catalogo__categoria-titulo {
        font-size: 30px;
    }
    .produto-card__legenda{
        font-size: 24px;
    }
}


@media screen and (max-width: 480px) {

    .catalogo {
        padding: 20px 15px;
    }

    .catalogo__categoria-titulo {
        font-size: 23px;
    }

    .catalogo__ver-mais {
        padding: 8px;
        font-size: 11px;
    }

    .catalogo__produtos {
        gap: 10px;
    }

    .produto-card__imagem {
        height: 190px;
        
    }

    .produto-card__legenda{
        font-size: 15px;
    }
    
}
